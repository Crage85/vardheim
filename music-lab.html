<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vardheim Music Lab</title>
    <style>:root{--ink:#f4efe6;--dim:#f4efe6aa;--faint:#f4efe666;--gold:#e8c77a;--gold-hi:#ffe3a0;--btn-ink:#1a140c;--panel:#161c26;--panel-b:#0d1118;--line:#f4efe626;--line-2:#f4efe655;--stage:#0b0e14;--good:#7fe07f;--bad:#ff6a5a;--warden:#6fc3ff;--enemy:#ff8028;--off:#8f8a80}*{box-sizing:border-box}html,body{background:var(--stage);color:var(--ink);margin:0;font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif}main{max-width:1280px;margin:0 auto;padding:12px}h1{color:var(--gold);margin:4px 0 2px;font-size:22px}h2{color:var(--gold);margin:0 0 8px;font-size:17px}p.sub{color:var(--dim);margin:0 0 12px;font-size:15px}.bar{flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;display:flex}.grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px;display:grid}@media (max-width:820px){.grid{grid-template-columns:1fr}}section{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:12px;padding:12px}button,select,input[type=number]{min-height:44px;font:inherit;border:1px solid var(--line-2);background:var(--panel-b);color:var(--ink);border-radius:4px;padding:6px 12px}button{cursor:pointer}button.main{background:var(--gold);color:var(--btn-ink);border-color:var(--gold-hi);min-width:120px;font-weight:700}button.on{background:var(--ink);color:var(--btn-ink)}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}select:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}.tabs{gap:6px;margin-bottom:10px;display:flex}.presets{grid-template-columns:1fr 1fr;gap:8px;display:grid}@media (max-width:520px){.presets{grid-template-columns:1fr}}.brief{min-height:2.8em;margin:-4px 0 12px;font-size:15px}.off{opacity:.4}.preset{text-align:left;padding:10px 12px}.preset b{display:block}.preset span{color:var(--dim);font-size:14px}.preset.on span{color:#1a140ccc}label.row{grid-template-columns:1fr auto;align-items:center;gap:2px 10px;margin:8px 0;font-size:15px;display:grid}label.row input[type=range]{width:100%;height:36px;accent-color:var(--gold);grid-column:1/-1}label.row output{color:var(--gold-hi);font-variant-numeric:tabular-nums}.checks{grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:6px;margin:4px 0 8px;display:grid}.checks label{border:1px solid var(--line-2);border-radius:4px;align-items:center;gap:6px;min-height:44px;padding:0 10px;display:flex}.checks input{width:20px;height:20px;accent-color:var(--gold)}fieldset{border:0;margin:10px 0 0;padding:0}legend{color:var(--gold);padding:0;font-size:15px;font-weight:700}#status{color:var(--dim);font-size:15px}#status.bad{color:var(--bad)}.progress{background:var(--panel-b);border-radius:5px;height:10px;margin:8px 0 4px;overflow:hidden}.progress div{background:var(--gold);width:0;height:100%}.now{font-size:15px}.now .big{margin-bottom:4px;font-size:18px;font-weight:700}.layers{gap:4px;margin:8px 0;display:grid}.layer{grid-template-columns:12em 1fr 3.5em;align-items:center;gap:8px;font-size:15px;display:grid}.layer .meter{background:var(--panel-b);border-radius:3px;height:12px;overflow:hidden}.layer .meter div{background:var(--off);height:100%}.layer.warden .meter div{background:var(--warden)}.layer.enemy .meter div{background:var(--enemy)}.layer.bed .meter div{background:var(--gold)}.layer .tag{color:var(--dim);text-align:right;font-size:14px}ul.why{margin:6px 0 0;padding-left:18px;font-size:15px}#log{max-height:none;color:var(--dim);font-size:14px}#log div{border-top:1px solid var(--line);padding:3px 0}#log b{color:var(--ink);font-weight:600}.hint{color:var(--dim);margin:4px 0;font-size:14px}</style>
    <script type="module" crossorigin src="/vardheim/assets/musiclab-DsCs5iLb.js"></script>
    <link rel="modulepreload" crossorigin href="/vardheim/assets/defineProperty-Dh_H4_pV.js">
    <link rel="modulepreload" crossorigin href="/vardheim/assets/tuning-BEkERqB-.js">
  </head>
  <body>
    <main>
      <h1>Music Lab</h1>
      <p class="sub">Hear the battle music mix itself. Pick a simulated wave, or set up your own fight, and press Play. Changes are heard within a few seconds.</p>
      <div class="bar">
        <label for="pack">Version</label>
        <select id="pack"></select>
        <button id="play" class="main" disabled>Play</button>
        <button id="restart" disabled>Start over</button>
        <label for="quality">Sound quality</label>
        <select id="quality"></select>
        <span id="status">Looking for music packs...</span>
      </div>
      <p id="pack-note" class="hint"></p>
      <div id="brief" class="brief">Press Play to hear it.</div>
      <div class="grid">
        <div>
          <section>
            <div class="tabs" role="tablist">
              <button id="tab-presets" class="on" role="tab">Simulated waves</button>
              <button id="tab-custom" role="tab">Make your own</button>
            </div>
            <div id="pane-presets"></div>
            <div id="pane-custom" hidden></div>
          </section>
        </div>
        <div>
          <section class="now" id="now"><h2>What the music is doing</h2><p class="hint">Press Play to start.</p></section>
          <section><h2>Bar by bar</h2><div id="log"></div></section>
        </div>
      </div>
    </main>
  </body>
</html>
