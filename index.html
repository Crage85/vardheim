    <style>html,body{background:#000;height:100%;margin:0;overflow:hidden}#app{position:fixed;top:0;bottom:0;left:0;right:0}#old-browser{z-index:60;color:#f4efe6;text-align:center;background:#05070b;padding:12vh 1em 0;font:500 18px/1.5 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;position:fixed;top:0;bottom:0;left:0;right:0}#old-browser h2{letter-spacing:.18em;margin:0 0 .6em;font-size:2em;font-weight:900}#old-browser p{max-width:34em;margin:.6em auto}</style>
    <script type="module" crossorigin src="/vardheim/assets/main-C9kWzu8z.js"></script>

  <body>
    <div id="app"></div>
    <!-- Old browsers: the game needs JavaScript modules, ES2020 syntax (vite.config.ts build.target) and WebGL2. Written
         in old JavaScript on purpose so any browser can run it. -->
    <script>
      (function () {
        var old = !('noModule' in document.createElement('script'));
        if (!old) {
          try {
            new Function('var a = {}; return a?.b ?? 1;');
          } catch (e) {
            old = true;
          }
        }
        if (!old && !window.WebGL2RenderingContext) old = true;
        if (!old) return;
        var box = document.createElement('div');
        box.id = 'old-browser';
        box.innerHTML =
          '<h2>PLEASE UPDATE YOUR BROWSER</h2>' +
          '<p>This browser is too old to run Vardheim.</p>' +
          '<p>Install the newest Chrome, Edge or Firefox (all free), then open this link again.</p>';
        document.body.appendChild(box);
      })();
    </script>
  </body>
